name: SonarCloud Monorepo Analysis
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-clean:
    name: Analyze Clean Architecture
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Install Sonar scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Build and analyze Clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet new sln -n TempClean
          dotnet sln TempClean.sln add BackendCleanArhitecture/LabResource.Domain/LabResource.Domain.csproj
          dotnet sln TempClean.sln add BackendCleanArhitecture/LabResource.Application/LabResource.Application.csproj
          dotnet sln TempClean.sln add BackendCleanArhitecture/LabResource.Infrastructure/LabResource.Infrastructure.csproj
          dotnet sln TempClean.sln add BackendCleanArhitecture/LabResource.CleanArhitectureAPI/LabResource.CleanApi.csproj
          dotnet-sonarscanner begin /k:"LabResource-CleanArchitecture" /o:"claudiudc21" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.coverage.exclusions="**/*" /d:sonar.exclusions="BackendVerticalSlice/**,FrontendAngular/**"
          dotnet build TempClean.sln
          dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

  analyze-vertical:
    name: Analyze Vertical Slice
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Install Sonar scanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Build and analyze Vertical
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"LabResource-VerticalSlice" /o:"claudiudc21" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.coverage.exclusions="**/*" /d:sonar.exclusions="BackendCleanArhitecture/**,FrontendAngular/**"
          dotnet build BackendVerticalSlice/LabResource.VerticalSliceAPI/LabResource.VerticalApi.csproj
          dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"