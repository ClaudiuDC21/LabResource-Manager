<p-toast></p-toast>
<p-confirmDialog [style]="{ width: '450px' }"></p-confirmDialog>

<div class="p-4 md:p-6 lg:p-8 transition-all transition-duration-300">
  <div class="mb-5">
    <h1 class="text-3xl font-bold text-900 m-0">User Management</h1>
    <p class="text-600 mt-2 m-0">View all accounts and manage platform access.</p>
  </div>

  <div class="surface-card p-4 shadow-2 border-round">
    <p-table
      #dt
      [value]="users()"
      [loading]="isLoading()"
      [paginator]="true"
      [rows]="10"
      [globalFilterFields]="['fullName', 'email', 'matriculationNumber']"
      responsiveLayout="scroll"
      styleClass="p-datatable-sm md:p-datatable-lg"
    >
      <ng-template pTemplate="caption">
        <div class="flex justify-content-end">
          <span class="p-input-icon-left w-full md:w-auto relative">
            <i class="pi pi-search absolute" style="left: 0.75rem; top: 50%; transform: translateY(-50%)"></i>
            <input
              pInputText
              type="text"
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              placeholder="Search by name, email or ID..."
              class="w-full md:w-20rem"
              style="padding-left: 2.5rem"
            />
          </span>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th scope="col" pSortableColumn="fullName">Name <p-sortIcon field="fullName"></p-sortIcon></th>
          <th scope="col" pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
          <th scope="col" pSortableColumn="matriculationNumber">Matriculation No. <p-sortIcon field="matriculationNumber"></p-sortIcon></th>
          <th scope="col" pSortableColumn="role">Role <p-sortIcon field="role"></p-sortIcon></th>
          <th scope="col" class="text-right">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr tabindex="0" class="cursor-pointer hover:bg-gray-100 transition-colors transition-duration-150" 
            (click)="viewUserDetails(user)" 
            (keydown.enter)="viewUserDetails(user)">
          
          <td class="font-medium text-800">{{ user.fullName }}</td>
          <td class="text-600">{{ user.email }}</td>
          <td class="text-600">{{ user.matriculationNumber || '-' }}</td>
          <td>
            <p-tag [value]="getRoleName(user.role)" [severity]="getRoleSeverity(user.role)"></p-tag>
          </td>
          <td class="text-right">
            @if (user.role === 1 || user.role === 'Student') {
              <button
                pButton
                icon="pi pi-ban"
                label="Deactivate"
                class="p-button-sm p-button-outlined p-button-danger"
                [disabled]="!user.isActive"
                (click)="deactivateUser(user, $event); $event.stopPropagation()"
                (keydown.enter)="deactivateUser(user, $event); $event.stopPropagation()"
              ></button>
            }
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center p-5 text-600">
            No users found.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
